[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchinferno"
version = "0.1.0"
description = "Torch-native inference experiments with a DSv4-style end-to-end path."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["huggingface-hub", "safetensors", "torch"]

[project.optional-dependencies]
dev = ["pyflakes", "pytest", "ruff", "vulture"]
flashinfer = ["flashinfer-python>=0.6.8,<0.7"]
helion = ["helion"]
kernels = ["triton"]
serve = ["tokenizers", "transformers"]
text = ["tokenizers", "transformers"]

[project.scripts]
torchinferno = "torchinferno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
