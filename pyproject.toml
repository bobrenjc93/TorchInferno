[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchinferno"
version = "0.1.0"
description = "Torch-native inference experiments with a DSv4-style end-to-end path."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["huggingface-hub", "safetensors", "torch"]

[project.optional-dependencies]
dev = ["pyflakes", "pytest", "ruff", "vulture"]
helion = ["helion"]
kernels = ["triton"]
# flashinfer enables the GRAPHED paged-KV decode (PagedEngine) for long-context
# serving -- context-flat decode that fixes the dense-decode-scales-with-context
# TPOT gap (multi_turn/long_output). It does NOT auto-select the regressive
# flashinfer FORWARD backend: that is gated off by default now
# (TORCHINFERNO_OPENAI_FLASHINFER_FORWARD=0), so the dense short-context forward
# stays dense (no few_shot 64-conc regression) while long-context gets paged.
serve = [
    "tokenizers",
    "transformers",
    "flashinfer-python==0.6.8.post1",
    "flashinfer-cubin==0.6.8.post1",
]
text = ["tokenizers", "transformers"]

[project.scripts]
torchinferno = "torchinferno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
