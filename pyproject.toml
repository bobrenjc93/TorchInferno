[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchinferno"
version = "0.1.0"
description = "Torch-native inference experiments with a DSv4-style end-to-end path."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["huggingface-hub", "safetensors", "torch"]

[project.optional-dependencies]
dev = ["pyflakes", "pytest", "ruff", "vulture"]
helion = ["helion"]
kernels = ["triton"]
# flashinfer is the fast paged prefill/decode path: the online batcher
# auto-selects the flashinfer cache backend whenever the package imports, and
# without it serving silently falls back to eager prefill (~4x worse TTFT on
# real 70B TP8). Pinned to the validated build; runtime degrades gracefully if
# absent, so this only affects installs that opt into the serve extra.
serve = [
    "tokenizers",
    "transformers",
    "flashinfer-python==0.6.8.post1",
    "flashinfer-cubin==0.6.8.post1",
]
text = ["tokenizers", "transformers"]

[project.scripts]
torchinferno = "torchinferno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
